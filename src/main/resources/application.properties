spring.application.name=spring-kafka-learning

spring.datasource.url=jdbc:postgresql://localhost:5432/spring_kafka_learning
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=true

server.servlet.context-path=/api

spring.kafka.bootstrap-servers=localhost:9092
# On peut avoir plusieurs bootstrap-servers en enchainant les virgules

# --- Consumer ---
spring.kafka.consumer.group-id=spring-learning-group
spring.kafka.consumer.auto-offset-reset=earliest
# Définit ce que Kafka doit faire si aucun offset enregistré n'existe (ex. premier démarrage).
# earliest -> commence à lire depuis le début du topic.
# latest -> commence à lire à partir des nouveaux messages seulement.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=edouard.yu.springkafkalearning.dto
#Le consumer peut deserialiser tous les json dans le package edouard.yu.springkafkalearning

# --- Producer ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
#spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

#  String(De)serializer, Json(De)serializer, Long(De)serializer : type de message qu'on veut traiter

topic=spring-kafka-learning
json.topic=spring-kafka-learning-json