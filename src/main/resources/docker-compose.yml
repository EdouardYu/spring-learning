services:
  db:
    container_name: mysql-db
    image: mysql:9.1.0
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: spring_actuator_learning

  adminer:
    container_name: adminer-mysql
    image: adminer:4.8.1
    restart: always
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db