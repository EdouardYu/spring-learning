services:
  db:
    container_name: postgres-db
    image: postgres:17.6
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: spring_kafka_learning
    volumes:
      - postgres-data:/var/lib/postgresql/data

  kafka:
    container_name: kafka
    image: apache/kafka:4.0.1
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      # Identifiant unique du nœud Kafka (obligatoire en mode KRaft)
      KAFKA_PROCESS_ROLES: broker,controller
      # Ce conteneur joue les deux rôles : broker (gestion des topics/messages)
      # et controller (gestion des métadonnées et quorum)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Définit le quorum des controllers KRaft : ici, un seul nœud (ID=1, host=kafka, port=9093)
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      # Liste des points d’écoute :
      # - PLAINTEXT : communication interne Docker (autres conteneurs)
      # - PLAINTEXT_HOST : accès depuis l'hôte (localhost)
      # - CONTROLLER : canal interne pour le rôle controller
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      # Adresses “annoncées” aux clients :
      # - Dans Docker : kafka:19092
      # - Depuis le PC : localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      # Associe chaque listener à un protocole (ici tous en clair sans SSL/SASL)
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Indique quel listener est utilisé entre brokers (utile si tu en ajoutes plusieurs)
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Spécifie le listener que les controllers utilisent pour communiquer entre eux
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      # Répertoire où Kafka stocke les logs et les métadonnées internes
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Nombre de copies pour le topic des offsets (1 car un seul broker)
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Délai avant que les consumer groups commencent à consommer (0 = immédiat)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Crée automatiquement un topic si un producteur ou un consommateur l’utilise

volumes:
  postgres-data: